- hosts: nfs
  tasks:
    - name: Install NFS Server
      yum:
        name: nfs-utils
        state: present
    - name: Configure NFS Server
      copy:
        content: "/data/ 192.168.0.0/24(rw,sync,all_squash,anonuid=666,anongid=666)"
        dest: /etc/exports
    - name: Create /data
      file:
        path: /data
        state: directory
        owner: www
        group: www



