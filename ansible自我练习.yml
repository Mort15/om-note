- hosts: webs
  tasks:
    - name: Install Nginx Server
      yum:
        name: nginx
        state: present
    - name: Configure Nginx Server
      copy:
        src: nginx.conf
        dest: /etc/nginx/nginx.conf
    - name: Create www Group
      group:
        gid: 666
        name: www
    - name: Create www User
      user:
        uid: 666
        name: www
        group: www
        shell: /sbin/nologin
        create_home: false
    - name: Start Nginx Server
      systemd:
        name: nginx
        state: started
        enabled: yes



