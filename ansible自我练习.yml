问题:
1,notify为什么放在copy下
2,notify为什么写的是handlers的name，可以写别人的？
3,notify是通过name匹配到handlers的，还是写死的 百分百匹配的是handlers?
4,我的猜想是否正确: copy报错，就去handlers重启nginx。(其实说不通)

答案总结问题:
1，（即产生了 changed 结果）时才会触发。  你是说 通知色-黄色字体-改变 吗？
2，只能写 handlers 里定义的 name。 我记住了，其实我感觉多此一举了。除非ansible可以写多个handler？
3，只认黄色改变，不认红色失败。我记住了。

最终答案: 通知色-黄色字体-改变 触发 notify 触发name对应的 handlers

