# 需求: 创建1.txt 属主属组root
#       创建2.txt  属主属组www

- hosts: webs
  tasks:
    - name: Create 1.txt 2.txt File
      file:
        path: /root/{{ item }}
        owner: root
        group: www
        mode: '0644'
      loop:
        - 1.txt
        - 2.txt

- hosts: webs
  tasks:
    - name: Cteate 1.txt 2.txt File
      file:
        path: /root/{{ item.name }}
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        state: touch
      loop:
        - { item.name: 1.txt, owner: root, group: root, mode: 0644 }
        - { item.name: 2.txt, owner: www, group: www, mode: 0644 }

- hosts: webs
  tasks:
    - name: 根据上面的案例，增加权限mode 1.txt 777 2.txt 600
      file:
        path: /root/{{ item.name }}
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        state: file
      loop:
        - { item.name: 1.txt, owner: root, group: root, mode: 0777 }
        - { item.name: 2.txt, owner: www, group: www, mode: 0600 }

# 创建两个用户:
# test01  uid 777 允许登录   创建家目录
# test02  uid 888 不允许登录 不创建家目录

- hosts: webs
  tasks:
    - name: 创建两个用户 test01 test02
      user:
        name: "{{ item.name }}"
        shell: "{{ item.shell }}"
        groups: "{{ item.groups }}"
        uid: "{{ item.uid }}"
        append: "{{ item.append }}"
        create_home: "{{ item.create_home }}"
      loop:
        - { name: test01, shell: /sbin/nologin, groups: test01, uid: 777, append: yes, create_home: no }
        - { name: test02, shell: /sbin/nologin, groups: test02, uid: 888, append: yes, create_home: no }

